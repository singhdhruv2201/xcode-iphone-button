name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - name: Register the selected Xcode scripting dictionary
        run: |
          developer_dir="$(xcode-select -p)"
          xcode_app="${developer_dir%/Contents/Developer}"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$xcode_app"
      - name: Validate scripts and isolated installation
        run: sh tests/check.sh
